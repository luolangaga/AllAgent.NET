<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeGraph</title>
  <link rel="stylesheet" href="settings.css" />
  <script src="/__sdk/allagent-plugin-sdk.js"></script>
</head>
<body>
  <div class="head">
    <span id="index" data-state="muted">正在检测索引…</span>
    <span id="path" class="mono muted"></span>
  </div>
  <div class="line">
    <span id="stats" class="mono muted"></span>
  </div>
  <div class="actions">
    <button id="init" type="button">构建 / 更新索引</button>
    <button id="rebuild" type="button">重建索引</button>
    <button id="cancel" type="button" hidden>取消</button>
  </div>
  <pre id="output" hidden></pre>
  <p class="hint">索引在插件进程内构建，首次查询会自动完成，不需要安装任何外部工具。索引保存在当前工作区的 <code>.codegraph/</code> 中。</p>
  <script src="settings.js"></script>
</body>
</html>
