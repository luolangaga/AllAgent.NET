name: Release

# Builds x64 and ARM64 installers, portable zips and both NuGet tool packages.
# Tags publish to GitHub Releases, nuget.org (when NUGET_API_KEY is set) and
# GitCode (when GITCODE_TOKEN is set).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.8；留空则使用 AllAgent.NET.Terminal.csproj 中的 Version）'
        required: false
        type: string
      dry_run:
        description: '只构建，不发布 GitHub / NuGet / GitCode'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            tag="v${version}"
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/AllAgent.NET.Terminal/AllAgent.NET.Terminal.csproj | head -1)"
            tag="v${version}"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version: $version ($tag), prerelease=$prerelease"

  web:
    name: Web frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/AllAgent.NET.Web/package-lock.json

      - name: Install, build and test
        working-directory: src/AllAgent.NET.Web
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: src/AllAgent.NET.Web/dist
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.runtime }}
    needs: [resolve, web]
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: src/AllAgent.NET.Web/dist

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (!(Test-Path $iscc)) { throw 'ISCC.exe is still missing after install.' }
          & $iscc /? | Select-Object -First 3

      - name: Build installer, portable zip and checksums
        shell: pwsh
        run: ./tools/build-installer.ps1 -Version ${{ needs.resolve.outputs.version }} -Runtime ${{ matrix.runtime }} -SkipWebBuild

      - name: Build NuGet tool package
        shell: pwsh
        run: ./tools/build-nuget.ps1 -Version ${{ needs.resolve.outputs.version }} -Runtime ${{ matrix.runtime }} -SkipWebBuild

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.runtime }}
          path: |
            artifacts/installer/AllAgent.NET-${{ needs.resolve.outputs.version }}-${{ matrix.runtime }}-setup.exe
            artifacts/installer/SHA256SUMS.${{ matrix.runtime }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.runtime }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/SHA256SUMS.${{ matrix.runtime }}.packages.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [resolve, package]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts/packages
          merge-multiple: true

      - name: Combine checksums
        shell: pwsh
        run: |
          $lines = @()
          $lines += Get-ChildItem artifacts -Filter 'SHA256SUMS.win-*.txt' | ForEach-Object { Get-Content $_.FullName }
          $lines += Get-ChildItem artifacts/packages -Filter 'SHA256SUMS.*.packages.txt' | ForEach-Object { Get-Content $_.FullName }
          if (!$lines) { throw 'No checksum files were produced.' }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: AllAgent.NET ${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          files: |
            artifacts/AllAgent.NET-*-setup.exe
            artifacts/packages/*.nupkg
            artifacts/SHA256SUMS.txt

      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
            Write-Host 'NUGET_API_KEY is not set; skipping nuget.org publish.'
            exit 0
          }
          Get-ChildItem artifacts/packages -Filter '*.nupkg' | ForEach-Object {
            Write-Host "Pushing $($_.Name)"
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  gitcode:
    name: Sync GitCode release
    needs: [resolve, release]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY || 'luolangaga/AllAgent.NET' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts/packages
          merge-multiple: true

      - name: Combine checksums for GitCode
        shell: pwsh
        run: |
          $lines = @()
          $lines += Get-ChildItem artifacts -Filter 'SHA256SUMS.win-*.txt' | ForEach-Object { Get-Content $_.FullName }
          $lines += Get-ChildItem artifacts/packages -Filter 'SHA256SUMS.*.packages.txt' | ForEach-Object { Get-Content $_.FullName }
          if (!$lines) { throw 'No checksum files were produced.' }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Fetch GitHub release notes
        shell: pwsh
        run: |
          if (-not $env:GITCODE_TOKEN) {
            Write-Host 'GITCODE_TOKEN is not set; skipping GitCode sync.'
            exit 0
          }
          gh release view "${{ needs.resolve.outputs.tag }}" --repo "${{ github.repository }}" --json body --jq .body | Set-Content release-notes.md -Encoding utf8

      - name: Create or update GitCode release
        shell: pwsh
        run: |
          if (-not $env:GITCODE_TOKEN) {
            Write-Host 'GITCODE_TOKEN is not set; skipping GitCode sync.'
            exit 0
          }
          $assets = @()
          $assets += Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe', '.txt' } | Select-Object -ExpandProperty FullName
          $assets += Get-ChildItem artifacts/packages -File -Filter '*.nupkg' | Select-Object -ExpandProperty FullName
          $prerelease = "${{ needs.resolve.outputs.prerelease }}" -eq 'true'
          ./tools/sync-gitcode-release.ps1 `
            -Tag "${{ needs.resolve.outputs.tag }}" `
            -Name "AllAgent.NET ${{ needs.resolve.outputs.version }}" `
            -BodyFile release-notes.md `
            -Assets $assets `
            -Repository "$env:GITCODE_REPOSITORY" `
            -Prerelease:$prerelease
