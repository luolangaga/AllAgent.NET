name: Release

# Builds the Windows installer (self-contained win-x64) and, for tags, attaches
# it to a GitHub Release.  See docs/windows-installer.zh-CN.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.7；留空则使用 AllAgent.NET.Terminal.csproj 中的 Version）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  installer:
    name: Build installer (win-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/AllAgent.NET.Web/package-lock.json

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (!(Test-Path $iscc)) { throw 'ISCC.exe is still missing after install.' }
          & $iscc /? | Select-Object -First 3

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } elseif ('${{ inputs.version }}') {
            $version = '${{ inputs.version }}'.Trim()
          } else {
            [xml]$project = Get-Content src/AllAgent.NET.Terminal/AllAgent.NET.Terminal.csproj
            $version = ($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Invalid installer version: '$version' (expected e.g. 1.0.7)." }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Install web dependencies
        working-directory: src/AllAgent.NET.Web
        run: npm ci

      - name: Build installer
        shell: pwsh
        run: tools/build-installer.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AllAgent.NET-${{ steps.version.outputs.value }}-win-x64-installer
          path: |
            artifacts/installer/AllAgent.NET-*-setup.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer/AllAgent.NET-*-setup.exe
            artifacts/installer/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
