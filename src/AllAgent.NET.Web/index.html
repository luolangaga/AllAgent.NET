<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="AllAgent.NET local agent workspace.">
    <title>AllAgent.NET</title>
    <script>
      // Apply the system theme and cached language before first paint so nothing flashes.
      try {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
      } catch (_) {}
      try {
        var cached = localStorage.getItem('allagent.language')
        var preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
        var chinese = preferred.some(function (value) { return String(value).toLowerCase().indexOf('zh') === 0 })
        var language = cached === 'zh' || cached === 'en' ? cached : (chinese ? 'zh' : 'en')
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'
        document.documentElement.dataset.language = language
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
